name: Update image links and sync COS

on:
  push:
    branches: [main]
    paths:
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.webp'
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - '*.gif'
      - '*.webp'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tencent COS SDK
        run: python3 -m pip install --disable-pip-version-check cos-python-sdk-v5

      - name: Upload images to Tencent COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: tengxunyun-erdong-1258870067
          COS_REGION: ap-hongkong
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path
          from qcloud_cos import CosConfig, CosS3Client

          secret_id = os.environ["COS_SECRET_ID"]
          secret_key = os.environ["COS_SECRET_KEY"]
          bucket = os.environ["COS_BUCKET"]
          region = os.environ["COS_REGION"]

          config = CosConfig(
              Region=region,
              SecretId=secret_id,
              SecretKey=secret_key,
              Scheme="https",
          )
          client = CosS3Client(config)
          extensions = {".png", ".jpg", ".jpeg", ".gif", ".webp"}
          files = sorted(
              p for p in Path(".").rglob("*")
              if p.is_file()
              and ".git" not in p.parts
              and p.suffix.lower() in extensions
          )

          for path in files:
              key = path.as_posix()
              client.put_object_from_file(
                  Bucket=bucket,
                  Key=key,
                  LocalFilePath=str(path),
              )
              print(f"Uploaded: {key}")

          print(f"Successfully uploaded {len(files)} image(s) to COS.")
          PY

      - name: Generate image link page and README list
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import html

          cdn_base = "https://img.ayudidiisokonline.top"
          extensions = {".png", ".jpg", ".jpeg", ".gif", ".webp"}
          files = sorted(
              p for p in Path(".").rglob("*")
              if p.is_file()
              and ".git" not in p.parts
              and p.suffix.lower() in extensions
          )

          rows = []
          cards = []
          for p in files:
              name = p.as_posix()
              url = f"{cdn_base}/{quote(name, safe='/')}"
              label = html.escape(name)
              rows.append(f"| {label} | [打开图片]({url}) |")
              cards.append(
                  '<article class="card">'
                  f'<img loading="lazy" src="{html.escape(url, quote=True)}" alt="{label}">'
                  f'<div class="name">{label}</div>'
                  f'<button type="button" data-url="{html.escape(url, quote=True)}">复制直链</button>'
                  '</article>'
              )

          marker_start = "<!-- IMAGE-LINKS:START -->"
          marker_end = "<!-- IMAGE-LINKS:END -->"
          listing = (
              marker_start + "\n"
              + "## 图片直链清单\n\n"
              + "| 图片文件 | 图片直链 |\n|---|---|\n"
              + ("\n".join(rows) if rows else "| 暂无图片 | |")
              + "\n\n" + marker_end
          )
          readme_path = Path("README.md")
          old = readme_path.read_text(encoding="utf-8") if readme_path.exists() else "# GitHub 图床\n"
          if marker_start in old and marker_end in old:
              before = old.split(marker_start, 1)[0].rstrip()
              after = old.split(marker_end, 1)[1].lstrip()
              new_readme = before + "\n\n" + listing + ("\n\n" + after if after else "\n")
          else:
              new_readme = old.rstrip() + "\n\n" + listing + "\n"
          readme_path.write_text(new_readme, encoding="utf-8")

          page = """<!doctype html>
          <html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>我的 GitHub 图床</title>
          <style>
          *{box-sizing:border-box}body{margin:0;padding:28px;background:#0b1020;color:#e8edf7;font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
          header{max-width:1100px;margin:0 auto 24px}h1{font-size:26px;margin:0 0 8px}.sub{color:#9ba8bd}
          main{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
          .card{background:#151d30;border:1px solid #293650;border-radius:14px;padding:12px;min-width:0}
          img{width:100%;height:170px;object-fit:contain;background:#0a0f1c;border-radius:9px}
          .name{margin:10px 0;overflow-wrap:anywhere;color:#dce5f5;font-size:13px}
          button{width:100%;border:0;border-radius:9px;padding:11px;background:#3478f6;color:white;font-weight:650;cursor:pointer}
          button.done{background:#16845b}.empty{grid-column:1/-1;color:#9ba8bd;padding:30px}
          </style></head><body><header><h1>我的 GitHub 图床</h1><div class="sub">自动生成图片直链 · 点击按钮复制</div></header><main>
          """ + ("\n".join(cards) if cards else '<div class="empty">还没有图片。上传 PNG、JPG、GIF 或 WebP 图片后，页面会自动更新。</div>') + """
          </main><script>
          document.querySelectorAll('button[data-url]').forEach(b=>b.addEventListener('click',async()=>{
            try{await navigator.clipboard.writeText(b.dataset.url);b.textContent='已复制 ✓';b.classList.add('done');setTimeout(()=>{b.textContent='复制直链';b.classList.remove('done')},1600)}
            catch(e){window.prompt('请复制图片直链：',b.dataset.url)}
          }));
          </script></body></html>"""
          Path("index.html").write_text(page, encoding="utf-8")
          PY

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html
          if ! git diff --cached --quiet; then
            git commit -m "更新图床图片直链清单"
            git push
          fi
