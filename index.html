<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的 GitHub 图床</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:28px;background:#0b1020;color:#e8edf7;font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
header{max-width:1100px;margin:0 auto 24px}h1{font-size:26px;margin:0 0 8px}.sub{color:#9ba8bd}
main{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:#151d30;border:1px solid #293650;border-radius:14px;padding:12px;min-width:0}
img{width:100%;height:170px;object-fit:contain;background:#0a0f1c;border-radius:9px}
.name{margin:10px 0;overflow-wrap:anywhere;color:#dce5f5;font-size:13px}
button{width:100%;border:0;border-radius:9px;padding:11px;background:#3478f6;color:white;font-weight:650;cursor:pointer}
button.done{background:#16845b}.empty{grid-column:1/-1;color:#9ba8bd;padding:30px}
</style></head><body><header><h1>我的 GitHub 图床</h1><div class="sub">自动生成图片直链 · 点击按钮复制</div></header><main>
<div class="empty">还没有图片。上传 PNG、JPG、GIF 或 WebP 图片后，页面会自动更新。</div>
</main><script>
document.querySelectorAll('button[data-url]').forEach(b=>b.addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(b.dataset.url);b.textContent='已复制 ✓';b.classList.add('done');setTimeout(()=>{b.textContent='复制直链';b.classList.remove('done')},1600)}
  catch(e){window.prompt('请复制图片直链：',b.dataset.url)}
}));
</script></body></html>
